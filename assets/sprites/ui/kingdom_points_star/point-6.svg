<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="tipGlow5" cx="12.0%" cy="58.7%" r="70%">
      <stop offset="0%" stop-color="#fff8dc" stop-opacity="0.95"/>
      <stop offset="15%" stop-color="#ffd700" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#ffd700" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#ffecb3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0.05"/>
    </radialGradient>
    <linearGradient id="axialGlow5" 
      x1="12.0%" y1="58.7%"
      x2="58.5%" y2="48.1%">
      <stop offset="0%" stop-color="#fff8dc" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ffd700" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ffd700" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffecb3" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="softGlow5" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- FIXED: userSpaceOnUse so vertical spine line gets full filter region -->
    <filter id="tightGlow5" filterUnits="userSpaceOnUse"
      x="0" y="0" width="500" height="500">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Layer 1: Broad radial glow -->
  <path d="M 59.89,293.39 L 309.85,297.73 Q 289.55,240.97 283.22,181.03 Z" fill="url(#tipGlow5)" filter="url(#softGlow5)" opacity="0.9"/>
  <!-- Layer 2: Axial gradient (even illumination tip→base) -->
  <path d="M 59.89,293.39 L 309.85,297.73 Q 289.55,240.97 283.22,181.03 Z" fill="url(#axialGlow5)" filter="url(#tightGlow5)" opacity="0.7"/>
  <!-- Layer 3: Bright spine core (FIXED: thin rect instead of line) -->
  <path d="M 60.22,294.85 L 59.56,291.93 L 291.97,238.88 L 292.64,241.81 Z" fill="#fff8dc" opacity="0.45" filter="url(#tightGlow5)"/>
</svg>