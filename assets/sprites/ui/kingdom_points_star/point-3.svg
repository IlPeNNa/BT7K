<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="tipGlow2" cx="88.0%" cy="58.7%" r="70%">
      <stop offset="0%" stop-color="#fff8dc" stop-opacity="0.95"/>
      <stop offset="15%" stop-color="#ffd700" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#ffd700" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#ffecb3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0.05"/>
    </radialGradient>
    <linearGradient id="axialGlow2" 
      x1="88.0%" y1="58.7%"
      x2="41.5%" y2="48.1%">
      <stop offset="0%" stop-color="#fff8dc" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ffd700" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ffd700" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffecb3" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="softGlow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- FIXED: userSpaceOnUse so vertical spine line gets full filter region -->
    <filter id="tightGlow2" filterUnits="userSpaceOnUse"
      x="0" y="0" width="500" height="500">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Layer 1: Broad radial glow -->
  <path d="M 440.11,293.39 L 216.78,181.03 Q 210.45,240.97 190.15,297.73 Z" fill="url(#tipGlow2)" filter="url(#softGlow2)" opacity="0.9"/>
  <!-- Layer 2: Axial gradient (even illumination tip→base) -->
  <path d="M 440.11,293.39 L 216.78,181.03 Q 210.45,240.97 190.15,297.73 Z" fill="url(#axialGlow2)" filter="url(#tightGlow2)" opacity="0.7"/>
  <!-- Layer 3: Bright spine core (FIXED: thin rect instead of line) -->
  <path d="M 440.44,291.93 L 439.78,294.85 L 207.36,241.81 L 208.03,238.88 Z" fill="#fff8dc" opacity="0.45" filter="url(#tightGlow2)"/>
</svg>